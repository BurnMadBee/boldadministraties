<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>βold Administraties — Contact</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root { --bg:#fff1e5; --surface:#fffaf5; --text:#33302e; --muted:#66605c; --accent:#0d7680; --border:#e8d5c4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header { background:var(--bg); border-bottom:1px solid var(--border); padding:1.1rem 2.5rem; display:flex; justify-content:space-between; align-items:center; }
  .logo { font-weight:650; font-size:1.25rem; letter-spacing:-0.2px; display:flex; align-items:center; gap:0.5rem; }
  .logo .name { color:var(--text); font-weight:600; letter-spacing:-0.3px; }
  nav a { margin-left:1.75rem; color:var(--muted); text-decoration:none; font-size:0.92rem; }
  nav a.active { color:var(--text); }
  .page { padding:4rem 2.5rem; max-width:700px; margin:0 auto; }
  h1 { font-family:Georgia,serif; font-size:2.6rem; font-weight:500; margin-bottom:1rem; }
  .lead { color:var(--muted); margin-bottom:2rem; }
  form { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:2.25rem; box-shadow:0 2px 12px rgba(0,0,0,0.04); }
  label { display:block; font-size:0.88rem; margin-bottom:0.4rem; font-weight:600; color:#444; }
  input, textarea { width:100%; padding:0.85rem 1rem; border:1px solid #ddd; border-radius:6px; font-size:1rem; margin-bottom:1.25rem; background:#fff; }
  textarea { min-height:130px; resize:vertical; }
  button { background:var(--accent); color:white; padding:0.95rem 2rem; border:none; border-radius:6px; font-weight:600; font-size:1rem; cursor:pointer; }
  button:hover { background:#0a5c64; }
  .mail { margin-top:1.5rem; color:var(--muted); }
  .mail a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <img src="logo.svg" alt="β" width="36" height="36" style="display:block;">
    <div class="name">Bold Administraties</div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="diensten.html">Diensten</a>
    <a href="aanpak.html">Aanpak</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>
<div class="page">
  <h1>Plan een kennismaking</h1>
  <p class="lead">Vertel kort waar je nu staat en wat je nodig hebt. We kijken of we passen en hoe we je kunnen helpen. Vrijblijvend en persoonlijk.</p>

  <form action="https://formspree.io/f/mjywrqpr" method="POST">
    <label>Naam</label>
    <input type="text" name="naam" required>
    <label>E-mail</label>
    <input type="email" name="email" required>
    <label>Bericht</label>
    <textarea name="bericht" required placeholder="Waar kunnen we je mee helpen?"></textarea>
    <button type="submit">Verstuur</button>
  </form>

  <p class="mail">Of mail direct naar <a href="mailto:info@boldadministraties.nl">info@boldadministraties.nl</a></p>
</div>
</body>
</html>
